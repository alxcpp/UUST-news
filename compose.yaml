services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - uust_news_data:/app/instance
    expose:
      - "8000"

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      NGINX_ENVSUBST_FILTER: DOMAIN
    volumes:
      - ./deploy/nginx/docker.conf:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/letsencrypt:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:latest
    profiles:
      - certbot
    ports:
      - "${HTTP_PORT:-80}:80"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:?Set CERTBOT_EMAIL in .env}
    volumes:
      - ./deploy/letsencrypt:/etc/letsencrypt
    command:
      - certonly
      - --standalone
      - --non-interactive
      - --agree-tos
      - --email
      - ${CERTBOT_EMAIL}
      - -d
      - ${DOMAIN}

volumes:
  uust_news_data:
